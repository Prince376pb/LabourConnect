spring:
  datasource:
    url: jdbc:h2:mem:labour_connect_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: super_secret_test_jwt_key_must_be_at_least_32_characters_long_for_hmac256
    expiration-ms: 3600000
  admin:
    init-email: testadmin@labourconnect.com
    init-password: AdminTest@1234
  seed-data: false
